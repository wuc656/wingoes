name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        goarch: [ "386", "amd64", "arm64" ]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Install go-winres
      run: go install github.com/tc-hib/go-winres@latest

    - name: Set up build directory
      run: mkdir -p .\bin

    - name: Build Binaries
      run: go build -v -o ./bin/ ./...
      env:
        GOARCH: ${{ matrix.goarch }}

    - name: Build Test Binaries
      run: go test -c -o ./bin/ ./...
      env:
        GOARCH: ${{ matrix.goarch }}

    - name: Bind Resources to All Binaries
      run: |
        foreach ($file in Get-ChildItem .\bin\*.exe) {
          go-winres patch $file.FullName
        }

    - name: Test
      if: ${{ matrix.goarch != 'arm64' }}
      run: |
        $rootDir = Get-Location
        $pkgDirs = @{
          "wingoes.test.exe"  = "."
          "com.test.exe"      = "com"
          "pe.test.exe"       = "pe"
          "registry.test.exe" = "registry"
        }
        foreach ($testExe in Get-ChildItem .\bin\*.test.exe) {
          Write-Host "Running $($testExe.Name)..."
          $targetRel = $pkgDirs[$testExe.Name]
          if ($null -eq $targetRel) {
            $targetRel = "."
          }
          Push-Location (Join-Path $rootDir $targetRel)
          try {
            cmd /c "$($testExe.FullName) -test.v"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }
        }
      env:
        GOARCH: ${{ matrix.goarch }}
